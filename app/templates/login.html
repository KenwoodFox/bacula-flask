<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vault</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
        }

        form {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
            font-size: 1.1rem;
        }

        input {
            flex: 1;
            min-width: 12rem;
            border: none;
            border-bottom: 1px solid #0a0;
            background: transparent;
            color: #0f0;
            font: inherit;
            outline: none;
            padding: 0.1rem 0;
        }

        input::placeholder {
            color: #060;
        }

        .err {
            position: absolute;
            margin-top: 2rem;
            color: #a00;
        }
    </style>
</head>

<body>
    <form method="post" action="{{ url_for('main.login', next=next_url) }}" autocomplete="off">
        <span>password:</span>
        <input type="password" name="password" autofocus required>
        {% if error %}<span class="err">denied</span>{% endif %}
    </form>
</body>

</html>
